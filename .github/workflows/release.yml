name: Release

# Creates a tag and GitHub release for every version in CHANGELOG.md that doesn't
# have a release yet. A missing tag is placed on the commit that first set that
# version in .claude-plugin/plugin.json; an existing tag is reused as is.
on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create missing tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          versions=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V)
          for version in $versions; do
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: release exists"
              continue
            fi
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              commit=$(git log --reverse --format=%H -S"\"version\": \"$version\"" -- .claude-plugin/plugin.json | head -n 1)
              if [ -z "$commit" ]; then
                echo "$tag: no commit sets version $version in plugin.json; skipping"
                continue
              fi
              git tag -a "$tag" "$commit" -m "jev-funnel $version"
              git push origin "refs/tags/$tag"
            fi
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[[^]]+\]: http/ { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            latest=false
            [ "$version" = "$current" ] && latest=true
            gh release create "$tag" --verify-tag --title "jev-funnel $version" \
              --notes-file notes.md --latest="$latest"
            echo "$tag: released"
          done
