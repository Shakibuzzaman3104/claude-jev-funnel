<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="title desc">
<title id="title">Measured with this CLI</title>
<desc id="desc">Animated benchmark of one live jev.py batch run on 2026-09-24. A counter rises from 0 to 500 items judged while a progress bar fills in real time over the measured 3.92 seconds of wall time. Stat tiles: 500 items, 2 questions each; 13 requests of up to 40 items, 0 errors; wall time 3.92 s with 8 workers and the cache off; request latency p50 2279 ms and p95 2355 ms over 13 requests; total cost $0.006094 as reported by OpenRouter for 145,106 input tokens; cost per 1,000 items $0.012188. Model typesafe/jev-1.13-20260917 via OpenRouter, synthetic app-review-style items. Source: benchmarks/results/2026-09-24.json.</desc>
