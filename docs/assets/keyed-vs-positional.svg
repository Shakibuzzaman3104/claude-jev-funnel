<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" role="img" aria-labelledby="title desc">
<title id="title">Referencing items: position vs key</title>
<desc id="desc">Animated comparison of two grids of 320 dots, one dot per yes/no answer. Left: items referenced by array position (items[i]) at 25 items per request; the dots fill in, then 29 scattered dots turn red: 29 of 320 answers landed on the wrong item, and 86 of 320 at 150 items per request. Right: items referenced by keyed id (items.k07), all 320 in one request: all 320 fill in and none are wrong. Placing each item's text inside its own question was also 0 of 320 wrong. Source: pedramamini's jev CLI gist (gist.github.com).</desc>
<defs>
<pattern id="pe" width="11" height="11" patternUnits="userSpaceOnUse"><circle class="ghost" cx="5.5" cy="5.5" r="4"/></pattern>
<pattern id="pa" width="11" height="11" patternUnits="userSpaceOnUse"><circle class="acc" cx="5.5" cy="5.5" r="4"/></pattern>
</defs>
