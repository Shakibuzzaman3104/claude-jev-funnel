<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
<title id="title">How far to trust each answer type</title>
<desc id="desc">Animated bar chart of expected calibration error (ECE) by Jev answer type; lower is better. noul (yes/no): 0.012 (n = 3,600), verdict: trust it. choice (pick one): 0.086 (n = 2,600), verdict: good. score (rubric): 0.254 (n = 600, one dataset), verdict: rank with it, don’t auto-act. Axis from 0 to 0.30. Source: PrimeLine, TypeSafe Jev pre-registered test (primeline.cc).</desc>
<style>
svg{--bg:#FFFFFF;--border:#D0D7DE;--ink:#1F2328;--muted:#59636E;--grid:#EAEEF2;--accent:#0C7A63;--yes:#1A7F37;--no:#CF222E;--unc:#9A6700;--cmp:#8C959F}
@media (prefers-color-scheme:dark){svg{--bg:#0D1117;--border:#30363D;--ink:#E6EDF3;--muted:#9198A1;--grid:#21262D;--accent:#3CC29F;--yes:#3FB950;--no:#F85149;--unc:#D29922;--cmp:#6E7681}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.card{fill:var(--bg);stroke:var(--border)}
.title{font-size:20px;font-weight:600}
.lbl{font-size:13px}
.muted{fill:var(--muted)}
.cap{font-size:11px;fill:var(--muted)}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.head{font-size:13px;font-weight:600}
.type{font-size:14px;font-weight:600}
.verd{font-size:14px}
.val{font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.tick{font-size:12px}
.grid{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--border);stroke-width:1}
.yes{fill:var(--yes)}.acc{fill:var(--accent)}.unc{fill:var(--unc)}
.glyph{stroke:var(--bg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.bar{transform-box:fill-box;transform-origin:0 50%}
.g0{animation:g0 9s infinite both}.v0{animation:v0 9s infinite both}.w0{animation:w0 9s infinite both}
.g1{animation:g1 9s infinite both}.v1{animation:v1 9s infinite both}.w1{animation:w1 9s infinite both}
.g2{animation:g2 9s infinite both}.v2{animation:v2 9s infinite both}.w2{animation:w2 9s infinite both}
@keyframes g0{0%,4.44%{transform:scaleX(0);opacity:1;animation-timing-function:cubic-bezier(.25,.6,.3,1)}17.78%{transform:scaleX(1)}93%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
@keyframes g1{0%,7.22%{transform:scaleX(0);opacity:1;animation-timing-function:cubic-bezier(.25,.6,.3,1)}20.56%{transform:scaleX(1)}93%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
@keyframes g2{0%,10%{transform:scaleX(0);opacity:1;animation-timing-function:cubic-bezier(.25,.6,.3,1)}25.56%{transform:scaleX(1)}93%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
@keyframes v0{0%,16.11%{opacity:0;animation-timing-function:cubic-bezier(.25,.6,.3,1)}20.56%,93%{opacity:1}100%{opacity:0}}
@keyframes v1{0%,18.89%{opacity:0;animation-timing-function:cubic-bezier(.25,.6,.3,1)}23.33%,93%{opacity:1}100%{opacity:0}}
@keyframes v2{0%,23.89%{opacity:0;animation-timing-function:cubic-bezier(.25,.6,.3,1)}28.33%,93%{opacity:1}100%{opacity:0}}
@keyframes w0{0%,24.44%{opacity:0;transform:translateX(-8px);animation-timing-function:cubic-bezier(.25,.6,.3,1)}30%{opacity:1;transform:none}93%{opacity:1}100%{opacity:0}}
@keyframes w1{0%,27.78%{opacity:0;transform:translateX(-8px);animation-timing-function:cubic-bezier(.25,.6,.3,1)}33.33%{opacity:1;transform:none}93%{opacity:1}100%{opacity:0}}
@keyframes w2{0%,31.11%{opacity:0;transform:translateX(-8px);animation-timing-function:cubic-bezier(.25,.6,.3,1)}36.67%{opacity:1;transform:none}93%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
