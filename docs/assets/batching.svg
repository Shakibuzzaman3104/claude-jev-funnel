<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img" aria-labelledby="title desc">
<title id="title">Batched vs one at a time</title>
<desc id="desc">Animated timeline on a shared time axis. Thirteen questions about one ~54,000-character GDPR article, sent as one batched request, finish in 0.27 s for $0.000497. The same thirteen questions sent one per request, one after another, take 2.71 s and $0.006090. Batching is 12.2 times cheaper and 10.0 times faster, and adds no bias or variance to the answers. Source: TypeSafe cookbook, Parallel questions (docs.typesafe.ai), 5 repeats of each strategy.</desc>
